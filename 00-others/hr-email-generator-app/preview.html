<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Template Preview</title>
  <style>
    body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #1E2430; color: #E2E8F0; }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 12px 18px; background: #11151C; border-bottom: 1px solid #2A3240; }
    header strong { font-size: 15px; margin-right: 6px; }
    .group { display: flex; gap: 4px; background: #1E2430; padding: 3px; border-radius: 8px; }
    button { font: inherit; font-size: 13px; border: 0; background: transparent; color: #CBD5E1; padding: 6px 11px; border-radius: 6px; cursor: pointer; }
    button.on { background: #3B82F6; color: #fff; }
    main { display: flex; gap: 22px; padding: 22px 18px; overflow-x: auto; align-items: flex-start; }
    .col { flex: none; }
    .col h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: #94A3B8; text-transform: uppercase; letter-spacing: 1px; }
    iframe { display: block; border: 0; border-radius: 8px; background: #fff; }
    .note { font-size: 12px; color: #94A3B8; }
  </style>
</head>
<body>
  <header>
    <strong>Template preview</strong>
    <div class="group" id="variants"></div>
    <div class="group" id="widths"></div>
    <div class="group" id="themes"></div>
    <span class="note">Dark = Outlook.com/new Outlook rules (same colors as Apple Mail dark)</span>
  </header>
  <main id="cols"></main>
  <script type="module" src="/src/preview.js"></script>
</body>
</html>
