    $(function () {
        $('.closeBtn').click(function () {
            $('.modal').modal('hide')
        })

        // CMS Minisite Navigation Active State Controller
        (function activateMinisiteNav() {
            var SLUG_MAP = [
                { slugs: ['our-program', 'our_program', 'mu1m7pyf'], selector: '.edu-program-page', idx: 0 },
                { slugs: ['why-certify', 'why_certify', 'mumg4yjj', 'understanding_certification', 'understanding-hr-certification'], selector: '.edu-uc-page', idx: 1 },
                { slugs: ['prep-courses', 'prep_courses', 'mumf46gh', 'hrci_shrm_prep_courses', '16-week', '8-week', 'aphr', 'shrm-prep'], selector: '.edu-prep-page, .edu-course-page', idx: 2 },
                { slugs: ['pass-guarantee', 'pass_guarantee', 'mummdg8g', 'pass-assurance', 'pass-assurance-program'], selector: '.edu-pass-page, .pass-assurance-wrapper', idx: 3 },
                { slugs: ['for-teams', 'for_teams', 'mummgo5u', 'cert-group-sales', 'group-certification', 'group'], selector: '.edu-group-page, .edu-team-page', idx: 4 },
                { slugs: ['recertification', 'mummk334', 'recert'], selector: '.edu-recert-page', idx: 5 },
                { slugs: ['testimonials', 'mummnw5t', 'hr-certification-testimonials'], selector: '.edu-testimonials-page', idx: 6 },
                { slugs: ['convince-employer', 'convince_employer', 'mummql5y', 'ask-my-employer', 'convince'], selector: '.edu-ask-page, .edu-convince-page', idx: 7 },
                { slugs: ['why-get-hr-certified', 'mummvk42', 'resources', 'secrets-to-passing', 'certification-resources'], selector: '.edu-res-wrap, .resource-article', idx: 8 }
            ];

            function clean(p) {
                if (!p) return '';
                return p.split('?')[0].split('#')[0].replace(/\/+$/, '').toLowerCase();
            }

            function runActivation() {
                var links = document.querySelectorAll('.domain-minisite-nav-link');
                if (!links || links.length === 0) return false;

                var curPath = clean(window.location.pathname);
                var curHref = (window.location.href || '').toLowerCase();
                var targetIdx = -1;

                // 1. Direct URL Pathname matching against each link's href
                for (var i = 0; i < links.length; i++) {
                    var lHref = clean(links[i].getAttribute('href'));
                    var lPath = clean(links[i].pathname);
                    if (lHref && (curPath === lHref || curPath.indexOf(lHref) !== -1 || (lHref.length > 5 && curHref.indexOf(lHref) !== -1))) {
                        targetIdx = i;
                        break;
                    }
                    if (lPath && lPath !== '/' && lPath !== '/en' && (curPath === lPath || curPath.indexOf(lPath) !== -1)) {
                        targetIdx = i;
                        break;
                    }
                }

                // 2. DOM Page Wrapper Match (reliable across CMS rewrites)
                if (targetIdx === -1) {
                    for (var s = 0; s < SLUG_MAP.length; s++) {
                        if (SLUG_MAP[s].selector && document.querySelector(SLUG_MAP[s].selector)) {
                            targetIdx = SLUG_MAP[s].idx;
                            break;
                        }
                    }
                }

                // 3. Slug Keyword Match in URL
                if (targetIdx === -1) {
                    for (var k = 0; k < SLUG_MAP.length; k++) {
                        for (var m = 0; m < SLUG_MAP[k].slugs.length; m++) {
                            var kw = SLUG_MAP[k].slugs[m].toLowerCase();
                            if (curPath.indexOf(kw) !== -1 || curHref.indexOf(kw) !== -1) {
                                targetIdx = SLUG_MAP[k].idx;
                                break;
                            }
                        }
                        if (targetIdx !== -1) break;
                    }
                }

                // 4. Root / Landing page fallback -> Index 0 (Our Program)
                if (targetIdx === -1 && (curPath === '' || curPath === '/' || curPath === '/en' || curPath === '/en/')) {
                    targetIdx = 0;
                }

                if (targetIdx < 0 || targetIdx >= links.length) return false;

                // Apply active classes
                for (var j = 0; j < links.length; j++) {
                    links[j].classList.remove('active', 'is-active', 'is-current');
                    links[j].removeAttribute('aria-current');
                    if (links[j].parentElement) {
                        links[j].parentElement.classList.remove('active', 'is-active', 'is-current', 'domain-minisite-nav-item--active');
                    }
                }

                var targetLink = links[targetIdx];
                targetLink.classList.add('active', 'is-active', 'is-current');
                targetLink.setAttribute('aria-current', 'page');
                if (targetLink.parentElement) {
                    targetLink.parentElement.classList.add('active', 'is-current', 'domain-minisite-nav-item--active');
                }

                // Auto-scroll active item into center view on mobile/tablet
                var navContainer = document.querySelector('nav.domain-minisite-nav');
                if (navContainer && navContainer.scrollWidth > navContainer.clientWidth) {
                    var cRect = navContainer.getBoundingClientRect();
                    var lRect = targetLink.getBoundingClientRect();
                    var scrollTarget = (lRect.left - cRect.left) + navContainer.scrollLeft - (navContainer.clientWidth / 2) + (lRect.width / 2);
                    try {
                        navContainer.scrollTo({ left: Math.max(0, scrollTarget), behavior: 'smooth' });
                    } catch (e) {
                        navContainer.scrollLeft = Math.max(0, scrollTarget);
                    }
                }

                return true;
            }

            runActivation();
            setTimeout(runActivation, 80);
            setTimeout(runActivation, 300);
            setTimeout(runActivation, 800);
        })();

        // Auto-scroll active submenu tab into center view on small desktops / mobile
        setTimeout(function () {
            var $active = $('.submenu_list > li > a.active');
            var $container = $('.hr_submenu_inner').length ? $('.hr_submenu_inner') : $('.hr_custom_submenu');
            if ($active.length && $container.length) {
                var containerEl = $container[0];
                if (containerEl.scrollWidth > containerEl.clientWidth) {
                    var scrollTarget = $active.offset().left - $container.offset().left + containerEl.scrollLeft - ($container.width() / 2) + ($active.outerWidth() / 2);
                    $container.animate({ scrollLeft: scrollTarget }, 300);
                }
            }
        }, 200);

        // Sticky Submenu Past Fold
        (function () {
            var submenu = document.getElementById('eduCustomSubmenu') || document.querySelector('.hr_custom_submenu');
            var container = document.getElementById('eduSubmenuContainer') || (submenu ? submenu.parentElement : null);
            var placeholder = document.getElementById('eduSubmenuPlaceholder');
            if (!submenu || !container) return;

            var isStuck = false;

            function getDocScrollTop() {
                return window.pageYOffset || window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
            }

            var baseTop = 0;
            function measureBaseTop() {
                if (placeholder && placeholder.style.display !== 'none') {
                    baseTop = placeholder.getBoundingClientRect().top + getDocScrollTop();
                } else {
                    var curScroll = getDocScrollTop();
                    var rect = container.getBoundingClientRect();
                    baseTop = rect.top + curScroll;
                }
            }

            measureBaseTop();

            function updateSticky() {
                var scrollY = getDocScrollTop();
                if (baseTop <= 0) {
                    measureBaseTop();
                }

                if (scrollY > baseTop) {
                    if (!isStuck) {
                        var h = container.offsetHeight || submenu.offsetHeight;
                        if (placeholder) {
                            placeholder.style.display = 'block';
                            placeholder.style.height = h + 'px';
                            placeholder.style.margin = '0px';
                        }
                        container.classList.add('is-stuck');
                        submenu.classList.add('is-stuck');
                        isStuck = true;
                    }
                } else {
                    if (isStuck) {
                        container.classList.remove('is-stuck');
                        submenu.classList.remove('is-stuck');
                        if (placeholder) {
                            placeholder.style.display = 'none';
                            placeholder.style.height = '0px';
                        }
                        isStuck = false;
                    }
                }
            }

            var ticking = false;
            function onScroll() {
                if (!ticking) {
                    window.requestAnimationFrame(function () {
                        updateSticky();
                        ticking = false;
                    });
                    ticking = true;
                }
            }

            window.addEventListener('scroll', onScroll, { passive: true });
            document.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('touchmove', onScroll, { passive: true });
            window.addEventListener('resize', function () {
                measureBaseTop();
                updateSticky();
            });
            window.addEventListener('load', function () {
                measureBaseTop();
                updateSticky();
            });

            // Initial check
            setTimeout(updateSticky, 60);
        })();
    })
</script>
