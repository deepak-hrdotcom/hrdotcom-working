<style>
  .WebcastBlock_card {
    width: 100%;
    height: auto;
    min-height: 368px;
    padding: 30px 30px 90px 30px;
    margin-bottom: 30px;
    background: #fff;
    border-radius: 15px;
    border: 1px solid #e8ecf7;
    position: relative;
    margin-top: 80px;
  }
  .WebcastBlock_card .epub_intro_info {
    font-size: 15px;
    font-weight: 500;
    color: #e51069;
    line-height: 1.6;
    height: 48px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .WebcastBlock_card > h4 {
    font-size: 18px;
    font-weight: 700;
    color: #2a343e;
    line-height: 1.4;
    margin: 20px 0px 15px 0px;
  }
  .WebcastBlock_card > h4 > a {
    display: block;
    font-size: 18px;
    font-weight: 700;
    color: #2a343e;
    line-height: 1.4;
    transition: all 0.3s ease;
  }
  .WebcastBlock_card > h4 > a > span {
    display: block;
    font-size: 30px;
    font-weight: 700;
  }
  .WebcastBlock_card > h4 > a:hover {
    color: #2680eb;
    transition: all 0.3s ease;
  }
  .viewmore_pdf {
    position: absolute;
    bottom: 0px;
    left: 0px;
    width: 100%;
    height: 60px;
    padding: 0px 30px;
    border-radius: 0px 0px 15px 15px;
    background: linear-gradient(135deg, #e8ecf7, #e8ecf7);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .viewmore_pdf .vm_link {
    width: auto;
    color: #273a8f;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    transition: all 0.3s ease;
  }
  .viewmore_pdf .vm_dwpdf {
    width: auto;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }
  .viewmore_pdf .vm_dwpdf > a {
    display: block;
    text-decoration: none;
    cursor: pointer;
    position: relative;
    margin: 0px 5px;
  }
  .viewmore_pdf .vm_dwpdf > a > svg {
    display: block;
    max-width: 32px;
    transition: all 0.3s ease;
    transform: scale(1);
    position: relative;
    z-index: 2;
  }
  .viewmore_pdf .vm_dwpdf > a:hover > svg {
    transition: all 0.3s ease;
    transform: scale(1.05);
  }
  .viewmore_pdf .vm_dwpdf > a > span {
    display: block;
    width: 104px;
    padding: 4px 4px;
    font-size: 8px;
    font-weight: 400;
    color: #fff;
    background: #000c;
    position: absolute;
    left: 50%;
    margin-left: -50px;
    text-transform: uppercase;
    transform: scale(0) translate(0px, -30px);
    border-radius: 10px;
    overflow: hidden;
    opacity: 0;
    transition: all 0.4s ease;
    text-align: center;
    transform-origin: center;
    line-height: 1.2;
  }
  .viewmore_pdf .vm_dwpdf > a:hover > span {
    opacity: 1 !important;
    transform-origin: center;
    transform: scale(1) translate(0px, 0px);
    z-index: 1;
    transition: all 0.4s ease;
  }
  .viewmore_pdf .vm_dwpdf > a[href='Hide'],
  .viewmore_pdf .vm_dwpdf > a[href='hide'] {
    display: none !important;
  }

  .mag_image_wrap {
    display: inline-block;
    width: auto;
    height: auto;
    min-height: 199px;
    background: #fff;
    position: relative;
    margin-top: -110px;
    border-radius: 15px;
    overflow: hidden;
  }
  .mag_image_wrap > img {
    display: block;
    margin: 0 auto;
    width: inherit;
    max-width: 100%;
    height: 199px;
    max-height: 199px;
  }
  .WebcastBlock_card.rmdwbtn .viewmore_pdf .vm_dwpdf {
    display: none;
  }
  @media screen and (min-width: 992px) {
    .epdrgnone {
      padding-right: 0px;
    }
  }
  @media screen and (max-width: 991px) {
  }
</style>
