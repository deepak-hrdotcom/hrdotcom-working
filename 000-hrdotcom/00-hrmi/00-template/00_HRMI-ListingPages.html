<header class="header">

          /><br />
          <button

            data-target="#modal-5c38bb8099a0bc12d67e8d17"

            Talk to Us</button

        </div>

        <div class="col-md-10 col-sm-12 col-xs-12 ">
          <div class="Page-Header MarginBottom20">
            <h3 class="Red">$StoryName</h3>
          </div>

          <div class="SubHeader">
            $var1<br />

<!-- Modal Popup -->
<div
  class="modal fade"
  id="myModal-ShortBio"
  tabindex="-1"
  role="dialog"
  aria-labelledby="myModalLabel"
>
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <button
          type="button"
          class="close"
          data-dismiss="modal"
          aria-label="Close"
        >
          <span aria-hidden="true">&times;</span>
        </button>
        <h4 class="modal-title" id="myModalLabel">Helpful Information</h4>
      </div>
      <div class="modal-body">
        <div class="row">$desc_long</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
