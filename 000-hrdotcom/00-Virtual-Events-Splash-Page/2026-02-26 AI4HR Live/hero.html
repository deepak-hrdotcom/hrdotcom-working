          virtualItem.month.slice(0, 3).toLowerCase() + virtualItem.day

        timelineData[key] = items.map((item) => ({
          date: `${item.month} ${item.day}`,
          year: String(item.year),
          desc: item.description,
          isVirtual: item.description === 'Virtual Event Date',
        }))
      })

      /* =========================================
   DOM REFERENCES
========================================= */

      const timelineList = document.getElementById('timeList')
      const tabButtons = document.querySelectorAll('.tab-button')

      /* =========================================
   RENDER FUNCTION
========================================= */

      function renderTimeline(dateKey) {
        const data = timelineData[dateKey]
        if (!data) return

        timelineList.innerHTML = data
          .map(
            (item) => `
      <li class="cs-time__item ${item.isVirtual ? 'is-virtual' : ''}">
        <div class="cs-time__date">
          <span class="cs-time__date-main">${item.date}</span>
          <span class="cs-time__date-year">${item.year}</span>
        </div>
        <p class="cs-time__desc">${item.desc}</p>
      </li>
    `
          )
          .join('')
      }

      /* =========================================
   TAB INTERACTION
========================================= */

      tabButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          tabButtons.forEach((b) => b.classList.remove('active'))
          btn.classList.add('active')
          renderTimeline(btn.dataset.date)
        })
      })

      /* =========================================
   INITIAL LOAD (MATCHES ACTIVE TAB)
========================================= */

      const activeTab = document.querySelector('.tab-button.active')
      if (activeTab) {
        renderTimeline(activeTab.dataset.date)
      }

      // date pills in the hero section==================================================================================

      document.addEventListener('DOMContentLoaded', () => {
        const pillsContainer = document.getElementById('heroEventPills')
        if (!pillsContainer) return

        const monthOrder = [
          'January',
          'February',
          'March',
          'April',
          'May',
          'June',
          'July',
          'August',
          'September',
          'October',
          'November',
          'December',
        ]

        // Extract Virtual Event Dates
        const virtualEvents = Object.values(eventTimelineData)
          .map((events) =>
            events.find((item) => item.description === 'Virtual Event Date')
          )
          .filter(Boolean)
          .sort(
            (a, b) => monthOrder.indexOf(a.month) - monthOrder.indexOf(b.month)
          )

        // Render pills
        pillsContainer.innerHTML = virtualEvents
          .map(
            (event) => `
          <li class="cs-hero__event-pill">
            ${event.month.slice(0, 3)} ${event.day}
          </li>
        `
          )
          .join('')
      })
    </script>
  </body>
</html>
