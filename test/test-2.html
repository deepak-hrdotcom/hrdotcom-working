<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily desk — Task list</title>
<style>
  :root { color-scheme: light; --ink:#233849; --muted:#637687; --blue:#255aca; --paper:#fff; --line:#dce5ed; --bg:#edf3f9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 'Trebuchet MS',sans-serif; }
  main { max-width:720px; margin:70px auto; padding:0 24px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:36px; }
  .mark { display:flex; align-items:center; gap:12px; font-weight:bold; }
  .icon { background:var(--blue); color:white; width:36px; height:36px; display:grid; place-items:center; border-radius:10px; font-size:22px; }
  time, .hint { color:var(--muted); font-size:14px; }
  h1 { font-size:clamp(32px,6vw,44px); line-height:1.2; letter-spacing:-1.5px; margin:0 0 12px; }
  .intro { color:var(--muted); margin:0 0 28px; }
  .desk { background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:26px; }
  form { display:flex; gap:10px; }
  input[type=text] { min-width:0; flex:1; padding:13px 14px; border:1px solid #a9bacb; border-radius:8px; font:inherit; }
  button { font:inherit; cursor:pointer; border:0; border-radius:8px; padding:11px 18px; background:var(--blue); color:#fff; }
  button:hover { filter:brightness(.92); }
  :focus-visible { outline:3px solid #e4a322; outline-offset:3px; }
  .summary { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:24px 0 10px; font-size:14px; color:var(--muted); }
  progress { display:block; width:100%; height:6px; border:0; border-radius:5px; overflow:hidden; accent-color:var(--blue); background:var(--bg); }
  progress::-webkit-progress-bar { background:var(--bg); }
  progress::-webkit-progress-value { background:var(--blue); }
  progress::-moz-progress-bar { background:var(--blue); }
  ul { padding:0; margin:20px 0 0; list-style:none; }
  li { display:flex; gap:12px; align-items:center; padding:15px 0; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li label { display:flex; align-items:center; flex:1; gap:12px; cursor:pointer; min-width:0; }
  li span { overflow-wrap:anywhere; }
  input[type=checkbox] { width:19px; height:19px; flex-shrink:0; accent-color:var(--blue); cursor:pointer; }
  li.done span { text-decoration:line-through; color:var(--muted); }
  .delete { background:transparent; color:var(--muted); font-size:22px; padding:2px 10px; }
  .empty { text-align:center; padding:35px 10px 24px; color:var(--muted); }
  footer { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:20px; }
  .clear { background:transparent; color:var(--blue); padding:6px 0; font-size:14px; }
  .clear:disabled { opacity:.45; cursor:default; }
  .hint { font-size:12px; }
  #status { min-height:20px; font-size:13px; color:var(--muted); margin:12px 0 0; }
  @media(max-width:520px) { main { margin:32px auto; padding:0 18px; } header { align-items:flex-start; flex-direction:column; gap:10px; } .desk { padding:18px; } form { flex-wrap:wrap; } form button { width:100%; } footer { align-items:flex-start; flex-direction:column; } }
</style>
</head>
<body>
<main>
  <header><div class="mark"><span class="icon" aria-hidden="true">✓</span>Daily desk</div><time id="date"></time></header>
  <h1>A little focus. A good day.</h1>
  <p class="intro">Keep your next steps in one place. One task at a time.</p>
  <section class="desk" aria-label="Daily tasks">
    <form id="task-form">
      <input id="task-input" type="text" aria-label="New task" placeholder="What needs doing?" maxlength="200" required autocomplete="off">
      <button type="submit">Add task</button>
    </form>
    <div class="summary"><span id="count">0 tasks remaining</span><span id="completed">0 of 0 done</span></div>
    <progress id="progress" value="0" max="1" aria-label="Task completion"></progress>
    <ul id="tasks"></ul>
    <p id="empty" class="empty">A clear desk. Add your first task above.</p>
    <footer><button id="clear" class="clear" type="button">Clear completed</button><span class="hint">Saved in this browser, on this device.</span></footer>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
</main>
<script>
(() => {
  const key = 'daily-desk-tasks-v1';
  const list = document.getElementById('tasks');
  const input = document.getElementById('task-input');
  const status = document.getElementById('status');
  let tasks = [];
  try {
    const saved = JSON.parse(localStorage.getItem(key) || '[]');
    if (Array.isArray(saved)) tasks = saved.filter(t => t && typeof t.id === 'string' && typeof t.text === 'string' && typeof t.done === 'boolean');
  } catch { status.textContent = 'Saved tasks could not be loaded. You can still use the list.'; }
  const now = new Date();
  const date = document.getElementById('date');
  date.dateTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  date.textContent = now.toLocaleDateString(undefined, {weekday:'long',month:'short',day:'numeric'});
  function save(message) {
    try { localStorage.setItem(key, JSON.stringify(tasks)); status.textContent = message; }
    catch { status.textContent = 'Browser storage is unavailable. Changes will last only until you close this page.'; }
    render();
  }
  function render() {
    list.replaceChildren();
    tasks.forEach(task => {
      const item = document.createElement('li');
      item.classList.toggle('done', task.done);
      const label = document.createElement('label');
      const check = document.createElement('input');
      check.type = 'checkbox'; check.checked = task.done;
      check.addEventListener('change', () => { task.done = check.checked; save(task.done ? 'Task completed.' : 'Task reopened.'); list.querySelectorAll('input')[tasks.indexOf(task)]?.focus(); });
      const text = document.createElement('span');
      text.textContent = task.text;
      label.append(check, text);
      const remove = document.createElement('button');
      remove.type = 'button'; remove.className = 'delete'; remove.textContent = '×';
      remove.setAttribute('aria-label', 'Delete task: ' + task.text);
      remove.addEventListener('click', () => { tasks = tasks.filter(t => t.id !== task.id); save('Task deleted.'); input.focus(); });
      item.append(label, remove); list.append(item);
    });
    const done = tasks.filter(t => t.done).length;
    const remaining = tasks.length - done;
    document.getElementById('count').textContent = `${remaining} task${remaining === 1 ? '' : 's'} remaining`;
    document.getElementById('completed').textContent = `${done} of ${tasks.length} done`;
    document.getElementById('progress').max = tasks.length || 1;
    document.getElementById('progress').value = done;
    document.getElementById('empty').hidden = tasks.length > 0;
    document.getElementById('clear').disabled = done === 0;
  }
  document.getElementById('task-form').addEventListener('submit', event => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) { input.value = ''; input.focus(); return; }
    tasks.push({id:Date.now().toString(36) + Math.random().toString(36).slice(2),text,done:false});
    input.value = ''; save('Task added.'); input.focus();
  });
  document.getElementById('clear').addEventListener('click', () => { tasks = tasks.filter(t => !t.done); save('Completed tasks cleared.'); input.focus(); });
  render();
})();
</script>
</body>
</html>
