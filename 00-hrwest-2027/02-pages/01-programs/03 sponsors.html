<style type="text/css">
  .head {
    font-size: 50px;

    display: flex;

    margin-top: 2rem;

  }

  .cta-block p {

  }

  .cta-block p span {
    font-size: 16px;

    margin-top: 10px;

    .cta-block {
      justify-content: start;
      gap: 3rem;
    }
  }

  /* title */
  .title h1 {
    font-size: 50px;
    font-weight: 900;
    letter-spacing: -0.03em;
    color: #2a343e;
    line-height: 1.2;
    margin: 20px 0px 10px 0px;
  }

  .title h2 {
    margin: 0;
  }

  /* end title */

  .hr-west_wrapper {
    min-height: auto;
    align-items: end;
  }

  /* section title */
  .section-title {
    display: grid;
    grid-template-columns: 1fr;
    align-items: end;
    justify-content: space-between;
    margin-top: 3rem;
  }

  .section-title h2 {
    margin: 0;
    padding: 0;
    line-height: 1;
    font-weight: 600;
  }

  .gradient-bar {
    display: none;
  }

  @media screen and (min-width: 768px) {
    .section-title {
      grid-template-columns: auto 1fr;
      gap: 2rem;
      margin-top: 8rem;
    }

    .section-title .gradient-bar {
      height: 5px;
      border-radius: 4px;
      width: 100%;
      background: linear-gradient(90deg,
          #00a0df 0%,
          #232288 27.8%,
          #e3007e 52.35%,
          #e51f1f 79.42%,
          #feed00 100%);
      display: block;
      margin-bottom: 0.3rem;
    }
  }

  /* end section title */

  /* sponsors */
  .sponsors {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 1rem;
    justify-content: center;
    align-items: center;
    justify-items: center;
    margin-block: 5rem;
    background: #ffffff;
    border-radius: 16px;
  }

  .sponsors img {
    /* border: 1px solid grey; */
    border-radius: 16px;
    padding: 2rem 1rem;
    max-width: 200px !important;
    max-height: 150px !important;
    transition: all 0.2s;
  }

  .sponsors img:hover {
    transform: scale(1.02);
  }

  /* end sponsors */

  .ev_logoMarqueeSection {
    display: none;
  }
</style>
