<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR.com Certification Redesign 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- Master Header Bar with Prominent Centered World Switcher -->
  <header class="app-header-master">
    <!-- Left: Brand & Project Info -->
    <div class="header-left-brand">
      <div class="brand-dots-pill">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="dot cyan"></span>
        <span class="brand-title">HR.com</span>
      </div>
      <div class="header-text-block">
        <span class="header-main-title">Education &amp; Certification Redesign</span>
        <span class="header-sub-tag">2026 Executive Review</span>
      </div>
    </div>
    
    <!-- Center: Prominent Segmented World Switcher ("The 3 Worlds") -->
    <div class="world-switcher-capsule" role="tablist" aria-label="Review Mode Switcher">
      <button class="world-capsule-btn" id="worldCritiqueBtn" data-mode="critique" role="tab" title="Press '1' on keyboard to switch">
        <span class="capsule-icon">🔍</span>
        <span class="capsule-label">1. Critique &amp; Audit</span>
        <span class="capsule-badge">7 Pages</span>
      </button>

      <button class="world-capsule-btn active" id="worldLowFiBtn" data-mode="lowfi" role="tab" title="Press '2' on keyboard to switch">
        <span class="capsule-icon">📐</span>
        <span class="capsule-label">2. Low-Fi Prototype</span>
        <span class="capsule-badge live">3 New Hubs</span>
      </button>

      <button class="world-capsule-btn disabled" id="worldHiFiBtn" disabled title="Hi-Fi Prototype in development" role="tab">
        <span class="capsule-icon">💎</span>
        <span class="capsule-label">3. Hi-Fi Prototype</span>
        <span class="capsule-badge soon">Coming Soon</span>
      </button>
    </div>

    <!-- Right: Presentation Helper Badges -->
    <div class="header-right-tools">
      <span class="key-hint-pill" title="Use Left and Right arrow keys to flip pages">⌨️ Arrow Keys to Navigate</span>
    </div>
  </header>


  <!-- Secondary Dynamic Sub-Navigation Bar -->
  <nav class="page-nav-bar" id="pageNavBar">
    <!-- Injected dynamically via main.js based on active world mode -->
  </nav>

  <!-- Main Workspace Container -->
  <main class="app-main" id="appMain">
    <!-- Dynamic View Injected via main.js -->
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
