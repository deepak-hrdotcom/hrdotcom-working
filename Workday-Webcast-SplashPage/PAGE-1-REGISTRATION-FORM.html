  <!-- ==========================================
       SUBMISSION DETECTOR SCRIPT
       ========================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const googleIframe = document.getElementById('googleFormIframe');
      const thanksModal = document.getElementById('workdayThanksModal');
      let iframeLoads = 0;

      // SUBMIT DETECTOR: Shows modal when Google Form is submitted
      if (googleIframe) {
        googleIframe.addEventListener('load', function() {
          iframeLoads++;
          // Load 1 = Initial form view
          // Load 2 = Form submitted inside iframe!
          if (iframeLoads > 1) {
            if (thanksModal) {
              thanksModal.classList.add('active');
            }
          }
        });
      }
    });
  </script>
